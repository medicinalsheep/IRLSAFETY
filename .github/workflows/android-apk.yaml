name: Android APK Release

# Manual only — go to Actions → this workflow → Run workflow.
# Publishes/updates prerelease v0.9.5-dev with the APK asset.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify detection model
        run: |
          test -f data/models/irlsafety-detect.onnx
          SIZE=$(stat -c%s data/models/irlsafety-detect.onnx)
          echo "Model size: ${SIZE} bytes"
          test "${SIZE}" -gt 10000000

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Extract ONNX Runtime prefab
        working-directory: android/app
        env:
          ORT_VERSION: "1.20.0"
        run: |
          chmod +x ../scripts/extract-ort-prefab.sh
          ../scripts/extract-ort-prefab.sh ort-prefab

      - name: Configure local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Package APK
        id: apk
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_NAME="IRLSAFETY+-${VERSION}-android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lh "${APK_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          retention-days: 90

      - name: Publish prerelease on Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: IRLSAFETY+ ${{ steps.apk.outputs.version }} (Android)
          prerelease: true
          make_latest: true
          overwrite_files: true
          files: ${{ steps.apk.outputs.apk_name }}
          body_path: android/RELEASE_NOTES.txt
          fail_on_unmatched_files: true