name: Push (OBS — manual only)

# OBS plugin builds are NOT run automatically (they fail without secrets/deps).
# To build Windows/macOS/Linux OBS packages: use workflow_dispatch here or Dispatch workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-project:
    name: Build OBS plugin packages
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read