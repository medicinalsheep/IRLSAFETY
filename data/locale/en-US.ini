IRLSAFETYPlus.Walkthrough.Body01="<p><b>Welcome to IRLSAFETY+</b> — real-time privacy for streams and recordings.</p><p>Everything runs <b>100% locally</b> on your Windows PC. No cloud, no uploads.</p><p>This guide explains the defaults and where to find settings. Click <b>Exit Guide</b> anytime — you can reopen it from the Control dock.</p>"
IRLSAFETYPlus.Walkthrough.Body02="<p><b>Add the filter to every source you want protected:</b></p><ul><li><b>Display / Window Capture</b> — fastest GPU path; best for screen text and custom keywords.</li><li><b>Video Capture Device</b> (webcam, GoPro, HDMI capture) — CPU path; supports YUY2/UYVY camera formats.</li><li><b>Media / VLC / browser sources</b> — add the filter on that source directly.</li></ul><ol><li>Right-click the source → <b>Filters → + → IRLSAFETY+</b>.</li><li>Leave <b>Enable All Protection</b> on.</li></ol><p>Cameras scan less often by default (every 6+ frames) to save CPU — lower <b>OCR Scan Every N Frames</b> if plates or signs on a body cam need faster updates.</p>"
IRLSAFETYPlus.Walkthrough.Body03="<p><b>Default categories (v0.7+):</b></p><ul><li><b>License Plates / Street Signs / Mail & Labels / IDs</b> — ON (train model for mail & IDs)</li><li><b>Screen Text</b> — ON (display/window capture)</li><li><b>Custom PII</b> — ON (your keyword list)</li><li><b>Sensitive Numbers</b> — OFF (enable in Advanced if needed)</li></ul><p><b>Typical setups:</b> Desk streamer = Display Capture + Screen Text. Unboxing / mail stream = train on UPS/FedEx/Amazon labels. IRL / GoPro = filter on camera — disable Screen Text on that source to save CPU.</p>"
IRLSAFETYPlus.Walkthrough.Body04="<p><b>Custom PII keywords</b> (names, emails, addresses — one per line):</p><ol><li>Open filter properties → <b>Custom PII List</b>.</li><li>Type keywords or load a .txt file.</li><li>Click outside the box to apply.</li></ol><p>Example: <code>John Smith</code> and <code>user@example.com</code></p><p>Matching is case-insensitive. Phrases and emails work best with <b>Solid Box</b> censor mode on Display Capture.</p>"
IRLSAFETYPlus.Walkthrough.Body05="<p><b>v0.7 defaults (simple & privacy-first):</b></p><ul><li><b>Censor Style:</b> Solid Box</li><li><b>Angled Cover:</b> ON — low-poly quad for tilted packages (needs OBB-trained model)</li><li><b>Scan Every N Frames:</b> 3</li><li><b>Stream Delay:</b> 1.5s baseline</li><li><b>Confidence:</b> 0.35</li></ul><p>No overlap padding — regions match detections tightly. Use <b>Test Effect</b> to verify overlays work.</p>"
IRLSAFETYPlus.Walkthrough.Body06="<p><b>Partial PII Cover (default 50%):</b> starts censoring when about half of a keyword is visible — good balance of privacy vs. false positives.</p><p><b>Cover While Typing (OFF by default):</b> turn ON to censor from the <b>first keystroke</b> when typing a keyword. Scans every frame while enabled. Use for high-risk streams where even partial names must never appear.</p><p>Hover any setting in filter properties for a full explanation.</p>"
IRLSAFETYPlus.Walkthrough.Body07="<p><b>Escalated Secure Mode (ON by default):</b> when you drag windows or OCR briefly loses track, the filter holds last-known overlays and can hide frames until PII is re-secured — prevents flash of sensitive text.</p><p><b>Hybrid Stream Delay (ON, 1.5s + 1.0s auto):</b> buffers stream output so detection can catch signs/plates before viewers see them. Increase further for fast IRL motion.</p><p>Disable Secure Frame Drop if you prefer held overlays without brief full-screen censor during motion.</p>"
IRLSAFETYPlus.Walkthrough.Body08="<p><b>Control dock:</b> OBS menu <b>Docks → IRLSAFETY+ Control</b></p><ul><li>Pick which filter instance to manage</li><li>Live OCR backend + model + overlay status</li><li>Quick category toggles</li><li>Training hub (capture, label, train — 100% local)</li><li><b>Resources</b> — OCR Guide, Platforms, Virtual Camera (text guides for your whole team)</li><li><b>Setup Guide</b> — reopens this walkthrough</li></ul><p>IRLSAFETY works beyond OBS over time (virtual camera, standalone app). Guides live in your models folder. Stay safe out there.</p>"
IRLSAFETYPlus.FilterDescription.Tooltip="IRLSAFETY+ is a video filter that detects sensitive content and covers it before it reaches your stream or recording. All processing is local."
IRLSAFETYPlus.EnableAll.Tooltip="Master switch. When off, the filter passes video through unchanged. Default: ON."
IRLSAFETYPlus.TestEffect.Tooltip="Draws a test box in the center of the frame. Use with Solid Box mode to confirm the filter is active. Default: OFF."
IRLSAFETYPlus.GroupCategories.Tooltip="What to detect: plates, signs, mail labels, IDs (YOLO model), plus Screen Text and Custom PII (OCR, no model required)."
IRLSAFETYPlus.GroupCustomPii.Tooltip="Your private keyword list — names, emails, phone numbers, etc. One entry per line. Never uploaded anywhere."
IRLSAFETYPlus.GroupProtection.Tooltip="Core settings: scan rate, censor style, angled cover for tilted objects, and stream delay."
IRLSAFETYPlus.GroupAdvanced.Tooltip="OCR detail, blur strength, secure mode, sensitive number patterns, GPU, debug, and custom model path."
IRLSAFETYPlus.CatStreetSigns.Tooltip="Street signs via YOLO model. Default: ON."
IRLSAFETYPlus.CatLicensePlates.Tooltip="License plates via YOLO model. Default: ON."
IRLSAFETYPlus.CatShippingLabels.Tooltip="Shipping labels and parcels — UPS, FedEx, Amazon, USPS, DHL, etc. Train with class shipping_label. Default: ON."
IRLSAFETYPlus.CatIdDocuments.Tooltip="Driver licenses, state IDs, passports held to camera. Train with class id_document. Default: ON."
IRLSAFETYPlus.CatScreenText.Tooltip="Uses Windows OCR to find text on screen and cover it. Essential for Display/Window Capture. Default: ON."
IRLSAFETYPlus.CatSensitivePatterns.Tooltip="OCR auto-detects credit cards, tracking numbers, SSN-style IDs, and phone numbers. No cloud. Default: OFF (enable in Advanced). See models/PII_STRATEGY.txt."
IRLSAFETYPlus.CatCustomPii.Tooltip="Matches OCR text against your keyword list. Enable after adding keywords below. Default: ON."
IRLSAFETYPlus.CustomPiiHint.Tooltip="Keywords apply when you click outside the text box or close properties. For Display Capture: use Solid Box censor and readable font sizes."
IRLSAFETYPlus.CustomPiiInline.Tooltip="One keyword per line. Examples: full name, email, address fragment. Case-insensitive. Partial matching uses the threshold below (default 50%)."
IRLSAFETYPlus.CustomPiiFile.Tooltip="Optional text file with one keyword per line. Loaded in addition to inline keywords. Path is stored in your OBS scene collection."
IRLSAFETYPlus.Confidence.Tooltip="Minimum YOLO detection confidence (plates, signs, etc.). Lower = more detections but more false positives. Default: 0.35. Only affects ONNX object detection."
IRLSAFETYPlus.FrameSkip.Tooltip="Run OCR/detection every N video frames. Overlays persist between scans via the region tracker. Lower = more CPU, faster updates. Default: 3."
IRLSAFETYPlus.OcrDetail.Tooltip="OCR resolution / pass count. Standard (1280px) is fastest for dense UIs. Maximum runs two scans for small text. Default: Standard (1280px)."
IRLSAFETYPlus.CensorMode.Tooltip="How sensitive areas are hidden. Solid Box is fastest on Display Capture (GPU). Custom Image uses PNG patterns with transparency (default: [CENSORED] bar). Blur/Ellipse/Cloud use CPU readback. Default: Solid Box."
IRLSAFETYPlus.CensorModeOverlay.Tooltip="Stretch a PNG (or JPG) with transparency over each detected region. Leave Custom Overlay Image empty to use the bundled sample-censored.png. GIF animation planned."
IRLSAFETYPlus.CensorOverlay.Tooltip="Optional path to your own overlay PNG/JPG/WebP. Supports transparent backgrounds and odd shapes. Empty = bundled [CENSORED] sample in overlays folder."
IRLSAFETYPlus.CensorColor.Tooltip="Fill color for Solid Box, Ellipse, and Cloud modes (ARGB). Default: dark gray #404040. Not used for Blur or Custom Image modes."
IRLSAFETYPlus.BlurStrength.Tooltip="Blur radius for Blur censor mode. Higher = stronger blur, more CPU/GPU work. Default: 24. Solid Box is recommended for signs and plates."
IRLSAFETYPlus.AngledCover.Tooltip="When ON and your model was trained with oriented boxes (OBB), covers tilted labels and IDs with a tight 4-corner quad instead of a big axis-aligned rectangle. Default: ON."
IRLSAFETYPlus.HybridDelayEnable.Tooltip="Adds stream/recording delay: baseline buffer plus extra time while PII overlays are active. Gives OCR time to catch up before viewers see content. Default: ON."
IRLSAFETYPlus.GlobalDelaySec.Tooltip="Always-on stream delay in seconds (via OBS output delay). Default: 1.5s. Set 0 to disable baseline delay while keeping auto protection delay."
IRLSAFETYPlus.AutoDelaySec.Tooltip="Extra delay added on top of global delay while PII is actively being covered. Default: +1.0s."
IRLSAFETYPlus.AutoDelayHoldSec.Tooltip="Keeps the auto protection delay for this many seconds after the last overlay disappears — avoids snapping back to live too soon. Default: 4.0s."
IRLSAFETYPlus.PartialPiiThreshold.Tooltip="Start covering a custom keyword when this fraction is visible (0–1). 0.50 = half the keyword shown. Lower = earlier cover, more false positives. Ignored when Cover While Typing is ON. Default: 0.50."
IRLSAFETYPlus.CoverWhileTyping.Tooltip="When ON, covers custom PII from the first matching keystroke (prefix of any keyword). Scans every frame on display sources. Higher CPU. Default: OFF."
IRLSAFETYPlus.SecureModeEnable.Tooltip="When ON, holds last secured overlays during drags/motion and escalates protection if OCR briefly loses track. Prevents sensitive text flashing on screen. Default: ON."
IRLSAFETYPlus.SecureDropFrames.Tooltip="When ON with Secure Mode, briefly hides frames (full-screen censor on Display Capture) until PII is re-secured after motion. Prevents uncensored flashes. Default: ON."
IRLSAFETYPlus.HybridDelayAudioNote.Tooltip="Planned: spoken keyword censorship will reuse this same delay timeline so audio and video stay aligned."
IRLSAFETYPlus.PreferGpu.Tooltip="Use GPU execution for YOLO ONNX when available (DirectML/CUDA). Default: ON."
IRLSAFETYPlus.UseChildOcr.Tooltip="Switch text OCR to local PP-OCR ONNX models (irlsafety-ocr-det.onnx + irlsafety-ocr-rec.onnx) instead of Windows OCR. Requires both model files in the plugin models folder."
IRLSAFETYPlus.ShowPreview.Tooltip="Debug: highlight detection regions. For troubleshooting only. Default: OFF."
IRLSAFETYPlus.EnableLogging.Tooltip="Write detailed IRLSAFETY+ messages to the OBS log (Help → Log Files). Useful for diagnosing OCR or model issues. Default: OFF."
IRLSAFETYPlus.ModelPath.Tooltip="Path to YOLO ONNX model (plates, signs, shipping_label, id_document). Leave blank to use bundled data/models/irlsafety-detect.onnx if present."