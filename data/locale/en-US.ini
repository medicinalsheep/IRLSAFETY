IRLSAFETYPlus.Walkthrough.Body01="<p><b>Welcome to IRLSAFETY+</b> — real-time privacy for streams and recordings.</p><p>Everything runs <b>100% locally</b> on your Windows PC. No cloud, no uploads.</p><p>This guide explains the defaults and where to find settings. Click <b>Exit Guide</b> anytime — you can reopen it from the Control dock.</p>"
IRLSAFETYPlus.Walkthrough.Body02="<p><b>Add the filter:</b></p><ol><li>Right-click your source (best: <b>Display Capture</b> or <b>Window Capture</b>).</li><li>Choose <b>Filters → + → IRLSAFETY+</b>.</li><li>Leave <b>Enable All Protection</b> on.</li></ol><p>Display Capture uses the fast GPU path. Cameras use the CPU path and scan less often.</p>"
IRLSAFETYPlus.Walkthrough.Body03="<p><b>Default categories (on first install):</b></p><ul><li><b>Screen Text</b> — ON (covers visible text on screen)</li><li><b>Custom PII</b> — ON (your keyword list)</li><li><b>License Plates / Street Signs</b> — OFF (need ONNX model)</li><li><b>Documents / Faces</b> — OFF</li></ul><p>Toggle categories under <b>Protection Categories</b> in filter properties, or use quick toggles in the Control dock.</p>"
IRLSAFETYPlus.Walkthrough.Body04="<p><b>Custom PII keywords</b> (names, emails, addresses — one per line):</p><ol><li>Open filter properties → <b>Custom PII List</b>.</li><li>Type keywords or load a .txt file.</li><li>Click outside the box to apply.</li></ol><p>Example: <code>John Smith</code> and <code>user@example.com</code></p><p>Matching is case-insensitive. Phrases and emails work best with <b>Solid Box</b> censor mode on Display Capture.</p>"
IRLSAFETYPlus.Walkthrough.Body05="<p><b>Recommended defaults:</b></p><ul><li><b>Censor Style:</b> Solid Box (fastest on Display Capture)</li><li><b>Overlay Overlap:</b> 0% — tight fit to OCR boxes (raise if tickers or angled text leak)</li><li><b>OCR Scan Every N Frames:</b> 2 — overlays persist between scans</li><li><b>OCR Detail:</b> Standard for busy UIs; Maximum for tiny text</li></ul><p>Use <b>Test Effect</b> to verify a center overlay appears.</p>"
IRLSAFETYPlus.Walkthrough.Body06="<p><b>Partial PII Cover (default 50%):</b> starts censoring when about half of a keyword is visible — good balance of privacy vs. false positives.</p><p><b>Cover While Typing (OFF by default):</b> turn ON to censor from the <b>first keystroke</b> when typing a keyword. Scans every frame while enabled. Use for high-risk streams where even partial names must never appear.</p><p>Hover any setting in filter properties for a full explanation.</p>"
IRLSAFETYPlus.Walkthrough.Body07="<p><b>Escalated Secure Mode (ON by default):</b> when you drag windows or OCR briefly loses track, the filter holds last-known overlays and can hide frames until PII is re-secured — prevents flash of sensitive text.</p><p><b>Hybrid Stream Delay (ON, 0.5s + 0.5s auto):</b> adds a small buffer to your stream/recording when PII is being covered. Viewers see slightly delayed but safer output.</p><p>Disable Secure Frame Drop if you prefer held overlays without brief full-screen censor during motion.</p>"
IRLSAFETYPlus.Walkthrough.Body08="<p><b>Control dock:</b> OBS menu <b>Docks → IRLSAFETY+ Control</b></p><ul><li>Pick which filter instance to manage</li><li>Live OCR / model / overlay status</li><li>Quick category toggles</li><li>Training frame capture (100% local)</li><li><b>Setup Guide</b> button — reopens this walkthrough</li></ul><p>You're ready. Hover any filter setting for details. Stay safe out there.</p>"
IRLSAFETYPlus.FilterDescription.Tooltip="IRLSAFETY+ is a video filter that detects sensitive content and covers it before it reaches your stream or recording. All processing is local."
IRLSAFETYPlus.EnableAll.Tooltip="Master switch. When off, the filter passes video through unchanged. Default: ON."
IRLSAFETYPlus.TestEffect.Tooltip="Draws a test box in the center of the frame. Use with Solid Box mode to confirm the filter is active. Default: OFF."
IRLSAFETYPlus.GroupCategories.Tooltip="Choose what types of content to detect. Screen Text and Custom PII work without a YOLO model. Plates and signs need irlsafety-detect.onnx."
IRLSAFETYPlus.GroupCustomPii.Tooltip="Your private keyword list — names, emails, phone numbers, etc. One entry per line. Never uploaded anywhere."
IRLSAFETYPlus.GroupProtection.Tooltip="How often to scan, how to censor, stream delay, partial keyword matching, and secure-mode behavior during motion."
IRLSAFETYPlus.GroupAdvanced.Tooltip="GPU preference, debug preview, logging, and custom ONNX model path."
IRLSAFETYPlus.CatStreetSigns.Tooltip="Detects street signs via bundled/custom YOLO ONNX model. Requires model file in the plugin models folder. Default: OFF."
IRLSAFETYPlus.CatLicensePlates.Tooltip="Detects license plates via YOLO ONNX model. Best for outdoor / driving streams. Default: OFF."
IRLSAFETYPlus.CatDocuments.Tooltip="Detects document-like regions (IDs, papers). Uses object detection when a model is loaded. Default: OFF."
IRLSAFETYPlus.CatFaces.Tooltip="Detects faces via object detection model. Default: OFF."
IRLSAFETYPlus.CatScreenText.Tooltip="Uses Windows OCR to find text on screen and cover it. Essential for Display/Window Capture. Default: ON."
IRLSAFETYPlus.CatCustomPii.Tooltip="Matches OCR text against your keyword list. Enable after adding keywords below. Default: ON."
IRLSAFETYPlus.CustomPiiHint.Tooltip="Keywords apply when you click outside the text box or close properties. For Display Capture: use Solid Box censor and readable font sizes."
IRLSAFETYPlus.CustomPiiInline.Tooltip="One keyword per line. Examples: full name, email, address fragment. Case-insensitive. Partial matching uses the threshold below (default 50%)."
IRLSAFETYPlus.CustomPiiFile.Tooltip="Optional text file with one keyword per line. Loaded in addition to inline keywords. Path is stored in your OBS scene collection."
IRLSAFETYPlus.Confidence.Tooltip="Minimum YOLO detection confidence (plates, signs, etc.). Lower = more detections but more false positives. Default: 0.45. Only affects ONNX object detection."
IRLSAFETYPlus.FrameSkip.Tooltip="Run OCR/detection every N video frames. Overlays persist between scans via the region tracker. Lower = more CPU, faster updates. Default: 2."
IRLSAFETYPlus.OcrDetail.Tooltip="OCR resolution / pass count. Standard (1280px) is fastest for dense UIs. Maximum runs two scans for small text. Default: Detailed (1920px balanced)."
IRLSAFETYPlus.CensorMode.Tooltip="How sensitive areas are hidden. Solid Box is fastest on Display Capture (GPU). Blur/Ellipse/Cloud use CPU readback and cost more GPU time. Default: Solid Box."
IRLSAFETYPlus.CensorColor.Tooltip="Fill color for Solid Box, Ellipse, and Cloud modes (ARGB). Default: dark gray #404040. Not used for Blur mode."
IRLSAFETYPlus.BlurStrength.Tooltip="Blur radius for Blur censor mode. Higher = stronger blur, more CPU/GPU work. Default: 12."
IRLSAFETYPlus.OverlayOverlap.Tooltip="Expands each overlay beyond detected text edges — helps rolling tickers, angled text, and OCR box inaccuracy. 0 = tight fit (default). Raise only if text leaks at the edges."
IRLSAFETYPlus.HybridDelayEnable.Tooltip="Adds stream/recording delay: baseline buffer plus extra time while PII overlays are active. Gives OCR time to catch up before viewers see content. Default: ON."
IRLSAFETYPlus.GlobalDelaySec.Tooltip="Always-on stream delay in seconds (via OBS output delay). Default: 0.5s. Set 0 to disable baseline delay while keeping auto protection delay."
IRLSAFETYPlus.AutoDelaySec.Tooltip="Extra delay added on top of global delay while PII is actively being covered. Default: +0.5s."
IRLSAFETYPlus.AutoDelayHoldSec.Tooltip="Keeps the auto protection delay for this many seconds after the last overlay disappears — avoids snapping back to live too soon. Default: 2.0s."
IRLSAFETYPlus.PartialPiiThreshold.Tooltip="Start covering a custom keyword when this fraction is visible (0–1). 0.50 = half the keyword shown. Lower = earlier cover, more false positives. Ignored when Cover While Typing is ON. Default: 0.50."
IRLSAFETYPlus.CoverWhileTyping.Tooltip="When ON, covers custom PII from the first matching keystroke (prefix of any keyword). Scans every frame on display sources. Higher CPU. Default: OFF."
IRLSAFETYPlus.SecureModeEnable.Tooltip="When ON, holds last secured overlays during drags/motion and escalates protection if OCR briefly loses track. Prevents sensitive text flashing on screen. Default: ON."
IRLSAFETYPlus.SecureDropFrames.Tooltip="When ON with Secure Mode, briefly hides frames (full-screen censor on Display Capture) until PII is re-secured after motion. Prevents uncensored flashes. Default: ON."
IRLSAFETYPlus.HybridDelayAudioNote.Tooltip="Planned: spoken keyword censorship will reuse this same delay timeline so audio and video stay aligned."
IRLSAFETYPlus.PreferGpu.Tooltip="Use GPU execution for YOLO ONNX when available (DirectML/CUDA). Default: ON."
IRLSAFETYPlus.ShowPreview.Tooltip="Debug: highlight detection regions. For troubleshooting only. Default: OFF."
IRLSAFETYPlus.EnableLogging.Tooltip="Write detailed IRLSAFETY+ messages to the OBS log (Help → Log Files). Useful for diagnosing OCR or model issues. Default: OFF."
IRLSAFETYPlus.ModelPath.Tooltip="Path to YOLO ONNX model for plates/signs. Leave blank to use bundled data/models/irlsafety-detect.onnx if present."